<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Обзор - VPN Routing UI</title>
  <link rel="icon" type="image/svg+xml" href="/cgi-bin/ui-asset.cgi/logo.svg">
  <link rel="stylesheet" href="/cgi-bin/ui-asset.cgi/app.css">
</head>
<body>
  <div class="app-shell overview-page-shell">
    <aside class="app-sidebar" aria-label="Основные разделы">
      <a class="app-sidebar-brand" href="/index.html" title="Открыть обзор VPN Routing UI">
        <img src="/cgi-bin/ui-asset.cgi/logo.svg" width="32" height="32" alt="">
        <strong>VPN Routing UI</strong>
      </a>
      <nav class="app-sidebar-nav">
        <a class="side-tab active" href="/index.html" aria-current="page">
          <span class="side-tab-icon" aria-hidden="true">◷</span>
          <span>Обзор</span>
        </a>
        <a class="side-tab" href="/profiles.html">
          <span class="side-tab-icon" aria-hidden="true">≡</span>
          <span>Профили</span>
        </a>
        <a class="side-tab" href="/dns-sync.html">
          <span class="side-tab-icon" aria-hidden="true">⇄</span>
          <span>DNS-группы</span>
        </a>
      </nav>
      <div class="app-sidebar-foot">Keenetic + Entware</div>
    </aside>

    <main class="page overview-page">
    <section class="hero">
      <h1>Обзор</h1>
      <div id="overviewStatusLine" class="overview-status-line" aria-label="Краткий статус" hidden></div>
    </section>

    <div id="banner" class="banner"></div>

    <section class="panel overview-ui-update">
      <div class="toolbar">
        <div class="update-line-main">
          <h2>Обновление интерфейса</h2>
          <span id="uiUpdateInfo" class="update-line-status" aria-live="polite">Версия UI не проверена.</span>
        </div>
        <div class="toolbar-right">
          <button id="checkUiUpdateBtn" class="secondary" type="button" title="Сравнить установленную версию интерфейса с версией в GitHub">Проверить версию</button>
          <button id="updateUiBtn" class="info" type="button" title="Проверить GitHub и предложить установить доступную версию интерфейса">Обновить UI</button>
        </div>
      </div>
    </section>

    <section class="panel overview-services">
      <div class="toolbar">
        <div class="update-line-main">
          <h2>Система</h2>
          <span id="engineUpdateInfo" class="update-line-status" aria-live="polite">Проверка пакетов Entware ещё не запускалась.</span>
        </div>
        <div class="toolbar-right">
          <button id="checkUpdatesBtn" class="secondary" type="button" title="Проверить доступные версии Xray и sing-box в Entware и GitHub">Проверить обновления</button>
          <button id="reloadBtn" class="refresh-button" type="button" aria-label="Обновить состояние системы" title="Перечитать состояние ядер, профилей и DNS-маршрутов" aria-busy="false" data-loading-label="Обновляем...">
            <span data-refresh-text>Обновить</span>
          </button>
        </div>
      </div>
      <div id="statusRows" class="engine-rows"></div>
    </section>
    </main>
  </div>

  <script src="/cgi-bin/ui-asset.cgi/system-health-widget.js"></script>
  <script src="/cgi-bin/ui-asset.cgi/root.js"></script>
</body>
</html>
